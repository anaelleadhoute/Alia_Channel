# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name alia-channel.com www.alia-channel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main
server {
    listen 443 ssl;
    server_name alia-channel.com www.alia-channel.com;

    ssl_certificate     /etc/letsencrypt/live/alia-channel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alia-channel.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Dashboard (password protected)
    location / {
        auth_basic "AL.IA Dashboard";
        auth_basic_user_file /etc/nginx/dashboard.htpasswd;
        proxy_pass http://alia_dashboard:80;
        proxy_set_header Host $host;
    }

    # Public — contest form (no auth)
    location /concours {
        proxy_pass http://alia_backend:8000/concours.html;
        proxy_set_header Host $host;
    }

    location /api/contests/submit {
        proxy_pass http://alia_backend:8000/api/contests/submit;
        proxy_set_header Host $host;
    }

